version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: techmart_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: .
    container_name: techmart_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mongodb://mongo:27017/techmart
      JWT_SECRET: techmart_rwanda_secret_2025
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongo
    command: >
      sh -c "npx prisma db push && node prisma/seed.js && npm start"

volumes:
  mongodata: